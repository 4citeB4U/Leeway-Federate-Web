# LEEWAY HEADER — DO NOT REMOVE
# REGION: CORE
# TAG: CORE.FEDERATE.CI.PEER_PROOF
# AUTHORITY: LeeWay-Standards
# 5WH: WHAT=Peer and human-connection browser qualification; WHY=Prove engine and simple UX before publication; WHO=Leeway Industries; WHERE=.github/workflows/peer-proof.yml; WHEN=2026-09-24; HOW=Pinned Playwright + isolated Chromium
# LICENSE: PROPRIETARY
name: Peer transport proof
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: peer-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Core and negative tests
        run: |
          node tests/self-test.mjs
          node --test tests/peer-core.test.mjs
      - name: Install pinned browser test tool
        run: |
          npm install --prefix "$RUNNER_TEMP/lw-playwright" --no-save --ignore-scripts --package-lock=false playwright@1.63.0
          "$RUNNER_TEMP/lw-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real peer proof, retest, and human connection proof
        run: |
          mkdir -p test-results
          export LEEWAY_PLAYWRIGHT_PATH="$RUNNER_TEMP/lw-playwright/node_modules/playwright"
          LEEWAY_TEST_RECEIPT=test-results/peer-first.json LEEWAY_SCREENSHOT=test-results/peer-first.png node tests/peer-browser.test.mjs
          LEEWAY_TEST_RECEIPT=test-results/peer-retest.json LEEWAY_SCREENSHOT=test-results/peer-retest.png node tests/peer-browser.test.mjs
          LEEWAY_HUMAN_SCREENSHOT=test-results/human-connect-mobile.png node tests/human-connect.test.mjs
      - name: Preserve actual results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peer-proof-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
